name: Create Comp LA release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build VST3 and standalone
        run: cmake --build build --config Release --parallel

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "Comp LA.vst3" | Select-Object -First 1
          $exe = Get-ChildItem -Path build -Recurse -File -Filter "Comp LA.exe" | Select-Object -First 1
          if (-not $vst -or -not $exe) { throw "Build output not found" }
          Copy-Item $vst.FullName -Destination dist -Recurse
          Copy-Item $exe.FullName -Destination dist

      - name: Make installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\CompLA.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Write release notes
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -eq "v1.0.0") {
            @"
          # Comp LA v1.0.0

          First public release of the Comp LA opto-style leveling compressor.

          ## Features
          - VST3 plugin and standalone Windows application
          - Opto-style compression with input, output, compression, and mix controls
          - Windows installer with VST3 installation support
          "@ | Set-Content release-notes.md
          } else {
            @"
          # Comp LA v2.0.0

          Metering and workflow update for the Comp LA opto-style leveling compressor.

          ## Features
          - Calibrated IN and OUT VU meters
          - Gain-reduction percentage meter
          - Harmonics meter
          - Built-in standalone test tone
          - Presets, preferences, and authorization menu
          - Smaller hamburger menu icon
          "@ | Set-Content release-notes.md
          }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Comp LA ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist-installer/*.exe
            dist/Comp LA.exe
            dist/Comp LA.vst3/**
